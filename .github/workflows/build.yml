name: Build JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

# ONE workflow: build the distributable JAR and publish that SAME JAR
# as a GitHub Release asset, so users have a stable direct-download URL.
# No server startup, world simulation, scheduled tests, or extra workflows.
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build distributable JAR
        run: ./gradlew clean build --stacktrace
      - name: Publish direct-download JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          TAG="v${VERSION}"
          JAR="build/libs/shulker-restorer-${VERSION}.jar"
          test -s "$JAR"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --title "Shulker Restorer ${VERSION} (Minecraft 26.3)" \
              --notes "Minecraft 26.3 Fabric mod restoring targeted Minecraft 1.20.5 Shulker mechanics. Experimental: long-term 1.28k farm reliability not yet established." \
              --latest
          fi
